name: APPCLASE
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --platform chrome
      - run: node --test scripts/api.test.mjs
      - run: flutter build web
      - run: node scripts/build_pwa.mjs
      - run: node --test scripts/pwa.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: appclase-web
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && vars.APPCLASE_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency: appclase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: appclase-web
          path: build/web
      - run: npx --yes wrangler@4 d1 migrations apply appclase --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx --yes wrangler@4 pages deploy build/web --project-name appclase --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
